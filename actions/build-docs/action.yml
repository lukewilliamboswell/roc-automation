name: Build documentation
description: Build an HTML site and PDF with a precompiled Roc renderer, plus optional Roc API reference.

inputs:
  docs-directory:
    description: Documentation source directory, relative to the repository root
    default: docs
  entrypoint:
    description: Manual entrypoint, relative to docs-directory
    default: index.adoc
  output-directory:
    description: Generated output directory, relative to the repository root
    default: .docs-out
  pdf-filename:
    description: Filename for the generated PDF
    default: manual.pdf
  docs-version:
    description: Version label used in source attributes and renderer metadata
    default: unreleased
  pdf-image-dpi:
    description: PDF raster image resolution, from 72 to 300 DPI; original HTML images are retained
    default: "144"
  api-entrypoint:
    description: Optional Roc platform or package root used to generate site/api
    default: ""
  roc-command:
    description: Roc executable used when api-entrypoint is set
    default: roc
  theme-directory:
    description: "Legacy backend only: Asciidoctor theme directory relative to repository root"
    default: ""
  backend:
    description: Renderer backend, roc (precompiled binary) or legacy (Docker and Asciidoctor)
    default: roc
  renderer-binary:
    description: Path or executable name for a precompiled roc-docs binary; otherwise ROC_DOCS_BINARY or PATH is used
    default: ""
  title:
    description: Optional document title override
    default: ""
  author:
    description: Optional author override
    default: ""
  language:
    description: Optional document language override
    default: ""

outputs:
  site-directory:
    description: Absolute path to the generated HTML site
    value: ${{ steps.build.outputs.site-directory }}
  pdf-path:
    description: Absolute path to the generated PDF manual
    value: ${{ steps.build.outputs.pdf-path }}

runs:
  using: composite
  steps:
    - id: build
      name: Render documentation
      shell: bash
      env:
        DOCS_ACTION_PATH: ${{ github.action_path }}
        DOCS_WORKSPACE: ${{ github.workspace }}
        DOCS_DIRECTORY: ${{ inputs.docs-directory }}
        DOCS_ENTRYPOINT: ${{ inputs.entrypoint }}
        DOCS_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        DOCS_PDF_FILENAME: ${{ inputs.pdf-filename }}
        DOCS_VERSION: ${{ inputs.docs-version }}
        DOCS_PDF_IMAGE_DPI: ${{ inputs.pdf-image-dpi }}
        DOCS_API_ENTRYPOINT: ${{ inputs.api-entrypoint }}
        DOCS_ROC_COMMAND: ${{ inputs.roc-command }}
        DOCS_THEME_DIRECTORY: ${{ inputs.theme-directory }}
        DOCS_BACKEND: ${{ inputs.backend }}
        DOCS_RENDERER_BINARY: ${{ inputs.renderer-binary }}
        DOCS_TITLE: ${{ inputs.title }}
        DOCS_AUTHOR: ${{ inputs.author }}
        DOCS_LANGUAGE: ${{ inputs.language }}
      run: >-
        bash "$DOCS_ACTION_PATH/build_docs.sh"
        --workspace "$DOCS_WORKSPACE"
        --docs-directory "$DOCS_DIRECTORY"
        --entrypoint "$DOCS_ENTRYPOINT"
        --output-directory "$DOCS_OUTPUT_DIRECTORY"
        --pdf-filename "$DOCS_PDF_FILENAME"
        --docs-version "$DOCS_VERSION"
        --pdf-image-dpi "$DOCS_PDF_IMAGE_DPI"
        --api-entrypoint "$DOCS_API_ENTRYPOINT"
        --roc-command "$DOCS_ROC_COMMAND"
        --theme-directory "$DOCS_THEME_DIRECTORY"
        --backend "$DOCS_BACKEND"
        --renderer-binary "$DOCS_RENDERER_BINARY"
        --title "$DOCS_TITLE"
        --author "$DOCS_AUTHOR"
        --language "$DOCS_LANGUAGE"
