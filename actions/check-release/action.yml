name: Check Roc release policy
description: Validate a dispatched release version, compiler compatibility branch, and exact checkout without publishing.
inputs:
  version:
    description: Independent package SemVer version, optionally a prerelease
    required: true
  allow-default-branch:
    description: Explicitly permit releases from the repository default branch
    default: 'false'
  allow-nightly-bootstrap:
    description: Transitional exact-nightly publication on the explicitly permitted default branch only
    default: 'false'
outputs:
  version:
    description: Validated release version
    value: ${{ steps.policy.outputs.version }}
  sha:
    description: Exact validated checkout and event commit
    value: ${{ steps.policy.outputs.sha }}
  compiler-pin:
    description: Exact compiler pin read from the validated checkout
    value: ${{ steps.policy.outputs.compiler-pin }}
  compiler-channel:
    description: stable or explicitly enabled nightly-bootstrap
    value: ${{ steps.policy.outputs.compiler-channel }}
  compiler-release:
    description: Verified official compiler release URL
    value: ${{ steps.policy.outputs.compiler-release }}
  maintenance-branch:
    description: Compiler maintenance branch, empty for default-branch releases
    value: ${{ steps.policy.outputs.maintenance-branch }}
runs:
  using: composite
  steps:
    - id: policy
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ inputs.version }}
        ALLOW_DEFAULT_BRANCH: ${{ inputs.allow-default-branch }}
        ALLOW_NIGHTLY_BOOTSTRAP: ${{ inputs.allow-nightly-bootstrap }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        POLICY_PATH: ${{ github.action_path }}
      run: python3 "$POLICY_PATH/check_release.py"
