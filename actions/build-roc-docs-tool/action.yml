name: Build the upstream Roc documentation utility
description: Cache and test a native renderer for this repository's unprivileged upstream CI; consumers use a released binary.
outputs:
  renderer-binary:
    description: Absolute path to the native tested renderer
    value: ${{ steps.target.outputs.binary }}
  system:
    description: Release system identifier
    value: ${{ steps.target.outputs.system }}
runs:
  using: composite
  steps:
    - id: target
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS:$RUNNER_ARCH" in
          Linux:X64) system=x86_64-linux ;;
          Linux:ARM64) system=aarch64-linux ;;
          macOS:ARM64) system=aarch64-darwin ;;
          *) echo 'Unsupported renderer build host' >&2; exit 2 ;;
        esac
        echo "system=$system" >> "$GITHUB_OUTPUT"
        echo "binary=$GITHUB_WORKSPACE/dist/roc-docs-$system" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: dist/roc-docs-${{ steps.target.outputs.system }}
        key: roc-docs-speed-${{ steps.target.outputs.system }}-nightly-2026-10-15-38e6c42-${{ hashFiles('tools/roc-docs/**/*.roc', 'tools/roc-docs/*.css', 'tools/roc-docs/*.js', 'tools/roc-docs/fonts/**', 'tools/roc-docs/prepared-diagrams/**', 'tools/roc-docs/vendor/**') }}
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
      with:
        version: nightly-new-compiler
        nightly-tag: nightly-2026-10-15-38e6c42
    - if: steps.cache.outputs.cache-hit != 'true'
      name: Build the optimized native renderer once
      shell: bash
      env:
        SYSTEM: ${{ steps.target.outputs.system }}
      run: |
        set -euo pipefail
        roc fmt --check tools/roc-docs
        roc test tools/roc-docs/test_highlight.roc
        roc test tools/roc-docs/test_html.roc
        roc test tools/roc-docs/test_assets.roc
        roc test tools/roc-docs/test_png.roc
        roc test tools/roc-docs/test_preparation.roc
        roc test tools/roc-docs/test_build_options.roc
        ROC="$(command -v roc)" roc tools/roc-docs/build.roc -- "$SYSTEM"
    - name: Test the exact renderer without a compiler on its PATH
      shell: bash
      env:
        ROC_DOCS_BINARY: ${{ steps.target.outputs.binary }}
        ROC_DOCS_ACTION_TEST_BINARY: ${{ steps.target.outputs.binary }}
      run: |
        set -euo pipefail
        chmod +x "$ROC_DOCS_BINARY"
        python3 tools/roc-docs/tests/test_cli.py -v
        python3 tools/roc-docs/tests/test_build.py -v
        python3 -m unittest discover -s tests -p test_build_docs.py -v
