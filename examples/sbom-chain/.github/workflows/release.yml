name: Release

# Run by hand from the default branch with a version to publish a release. A
# pull request runs the same build and tests as a dry run and publishes nothing.
#
# One release holds the package bundle and a native executable for each
# supported system, each with SPDX 3.0.1 and CycloneDX 1.7 sidecars bound to
# its final bytes. Everything is built once in read-only jobs, tested as those
# exact files, attested and published in one step by a job that checks out
# nothing and runs no repository code.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.1.0 or 0.1.0-rc1"
        required: true
        type: string
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-dry-run-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  # The Roc release the Blueprint 0.7.0 SBOM tool was built for. It also
  # builds the native executables, so the composition names one compiler.
  SBOM_COMPILER: nightly-2026-10-21-5349569

jobs:
  validate:
    name: Validate the request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.request.outputs.version }}
      prerelease: ${{ steps.request.outputs.prerelease }}
    steps:
      - name: Require the default branch for publication
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_TYPE" != branch ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Releases must run from the default branch" >&2
            exit 1
          fi
      - id: request
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.0.1-dry-run' }}
        run: |
          case "$VERSION" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          printf 'version=%s\nprerelease=%s\n' "$VERSION" "$prerelease" >> "$GITHUB_OUTPUT"

  bundle:
    name: Build the bundle and its sidecars
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8afd7ea035f2c04bbe91892cf98c04f62a43540a
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.SBOM_COMPILER }}
      - id: build
        name: Build the exact bundle that will be published
        run: |
          mkdir dist
          roc bundle package/main.roc --output-dir dist
          echo "file=$(ls dist/*.tar.zst)" >> "$GITHUB_OUTPUT"
      # The supplier's SBOM beside the locked file, recorded for inspect to verify.
      - uses: lukewilliamboswell/roc-automation/actions/fetch-dependency-sboms@8afd7ea035f2c04bbe91892cf98c04f62a43540a
        with:
          target: source
      - id: sidecars
        uses: lukewilliamboswell/roc-automation/actions/sbom-sidecars@8afd7ea035f2c04bbe91892cf98c04f62a43540a
        with:
          files: ${{ steps.build.outputs.file }}
          version: ${{ needs.validate.outputs.version }}
          target: source
          author: 'Organization: roc-automation contributors'
          imports: sbom/imports.json
      - name: Write the release notes from the evidence
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TOOL: ${{ steps.sidecars.outputs.tool-url }}
          COMPILER: ${{ steps.sidecars.outputs.compiler }}
          FILE: ${{ steps.build.outputs.file }}
        run: |
          {
            echo "# sbom-chain-example $VERSION"
            echo
            cat <<'TEXT'
          Every asset has `<asset>.spdx.json` (SPDX 3.0.1) and `<asset>.cdx.json` (CycloneDX 1.7) beside it, bound to its SHA-256 and covered by the release attestation.

          TEXT
            echo "Bundle: \`$(basename "$FILE")\`. SBOM tool: $TOOL on Roc \`$COMPILER\`."
          } > dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: |
            ${{ steps.sidecars.outputs.assets }}
            dist/notes.md
          if-no-files-found: error

  native:
    name: Build the executable and its sidecars (${{ matrix.system }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, system: x86_64-linux }
          - { runner: ubuntu-24.04-arm, system: aarch64-linux }
          - { runner: macos-15, system: aarch64-darwin }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8afd7ea035f2c04bbe91892cf98c04f62a43540a
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.SBOM_COMPILER }}
      - name: Build the exact executable that will be published
        run: |
          mkdir dist
          roc build app/main.roc --output=dist/hello-${{ matrix.system }}
      # The fetched compiler's publisher ships no SBOM; the composition's
      # reviewed unavailable_sboms entry becomes a visible coverage gap.
      - uses: lukewilliamboswell/roc-automation/actions/fetch-dependency-sboms@8afd7ea035f2c04bbe91892cf98c04f62a43540a
        with:
          target: ${{ matrix.system }}
          composition: sbom/composition-${{ matrix.system }}.json
          output: sbom/imports-${{ matrix.system }}.json
      - id: sidecars
        uses: lukewilliamboswell/roc-automation/actions/sbom-sidecars@8afd7ea035f2c04bbe91892cf98c04f62a43540a
        with:
          files: dist/hello-${{ matrix.system }}
          version: ${{ needs.validate.outputs.version }}
          target: ${{ matrix.system }}
          author: 'Organization: roc-automation contributors'
          composition: sbom/composition-${{ matrix.system }}.json
          imports: sbom/imports-${{ matrix.system }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.system }}
          path: ${{ steps.sidecars.outputs.assets }}
          if-no-files-found: error

  # Each executable runs where it must work, as the exact bytes its sidecars
  # describe. No checkout and no compiler: only the built files.
  test:
    name: Test the exact files (${{ matrix.system }})
    needs: [validate, native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, system: x86_64-linux }
          - { runner: ubuntu-24.04-arm, system: aarch64-linux }
          - { runner: macos-15, system: aarch64-darwin }
    runs-on: ${{ matrix.runner }}
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.system }}
      - name: Run the executable and check its sidecars describe these bytes
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          chmod +x "dist/hello-$SYSTEM"
          "dist/hello-$SYSTEM"
          actual=$(shasum -a 256 "dist/hello-$SYSTEM" | cut -d' ' -f1)
          described=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["metadata"]["component"]["hashes"][0]["content"])' "dist/hello-$SYSTEM.cdx.json")
          test "$actual" = "$described"
          grep -q "\"hashValue\":\"$actual\"" "dist/hello-$SYSTEM.spdx.json"

  # Holds the permissions to attest and publish, checks out nothing and runs
  # no repository code: it hands the tested files to the shared publisher.
  publish:
    name: Publish
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, bundle, native, test]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: candidate
      - name: Gather the complete asset set
        run: |
          mkdir release
          mv candidate/bundle/dist/*.tar.zst candidate/bundle/dist/*.tar.zst.spdx.json candidate/bundle/dist/*.tar.zst.cdx.json release/
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            mv "candidate/native-$system/dist/hello-$system" "candidate/native-$system/dist/hello-$system.spdx.json" "candidate/native-$system/dist/hello-$system.cdx.json" release/
          done
          test "$(find release -type f | wc -l)" = 12
      # The subjects are the exact files built and tested in this run; the
      # sidecars are subjects too, as Blueprint's own release attests them.
      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
          create-storage-record: false
      - name: Retain and verify the provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" release/provenance.sigstore.json
          for file in release/hello-* release/*.tar.zst release/*.json; do
            case "$file" in release/provenance.sigstore.json) continue ;; esac
            gh attestation verify "$file" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --bundle "$BUNDLE"
          done
      - uses: lukewilliamboswell/roc-automation/actions/publish-release@8afd7ea035f2c04bbe91892cf98c04f62a43540a
        with:
          version: ${{ needs.validate.outputs.version }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          notes-file: candidate/bundle/dist/notes.md
          assets: |
            release/*.tar.zst
            release/*.tar.zst.spdx.json
            release/*.tar.zst.cdx.json
            release/hello-x86_64-linux
            release/hello-x86_64-linux.spdx.json
            release/hello-x86_64-linux.cdx.json
            release/hello-aarch64-linux
            release/hello-aarch64-linux.spdx.json
            release/hello-aarch64-linux.cdx.json
            release/hello-aarch64-darwin
            release/hello-aarch64-darwin.spdx.json
            release/hello-aarch64-darwin.cdx.json
            release/provenance.sigstore.json

  # The required check of the dry run: green only when every job above passed.
  required:
    name: Release dry run
    if: always() && github.event_name == 'pull_request'
    needs: [validate, bundle, native, test]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do test "$result" = success; done
