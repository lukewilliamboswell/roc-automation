name: Release
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Authored release version
        type: string
        required: true
      full-dry-run:
        description: Force full rehearsal; dispatch always runs the complete lifecycle
        type: boolean
        default: false
permissions: {}
jobs:
  Lifecycle:
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      pages: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/release-lifecycle.yml@fe43c254d80986c61a6c1d3ba60c7ff99a75005b
    with:
      contract: 1
      version: ${{ inputs.version || '' }}
      full-dry-run: ${{ inputs.full-dry-run || false }}
      pages-documentation: manual
