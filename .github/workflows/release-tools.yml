name: Release tools
# Builds action programs and reusable policy/documentation utilities,
# tests the exact native executables, and publishes them once.
# A pull request runs the build and the tests as a dry run and publishes nothing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.1.0; the tag is tools-<version>
        required: true
        type: string
  pull_request:
permissions: {}
concurrency:
  group: release-tools-${{ github.ref }}
  cancel-in-progress: false
jobs:
  policy-build:
    name: Build policy utility (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-10-15-38e6c42
      - name: Check policy source and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/roc-policy/vendor/typos/verify.py
          roc check tools/roc-policy/main.roc
          roc fmt --check tools/roc-policy
          for suite in constants public_docs text_policy typo_data test_accounting path_glob sha256 embedded_profiles policy_plan; do
            roc test "tools/roc-policy/test_$suite.roc"
          done
      - name: Build the native release artifact
        shell: bash
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          ROC="$(command -v roc)" roc tools/roc-policy/build.roc -- "$SYSTEM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-tool-${{ matrix.system }}
          if-no-files-found: error
          path: dist/roc-policy-${{ matrix.system }}

  docs-build:
    name: Build documentation utility (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/build-roc-docs-tool
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-tool-${{ matrix.system }}
          if-no-files-found: error
          path: dist/roc-docs-${{ matrix.system }}

  # The Linux executables of the release utility come from build-tools. Apple
  # Silicon maintainers, and platform repositories testing their examples on
  # Intel macOS and Windows, run the same utility, so it is built natively
  # there too. Every
  # asset is named release-package-<system>, so one Blueprint recipe fetches it
  # on any system; Blueprint adds .exe where Windows needs it.
  release-package-build:
    name: Build release utility (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            system: aarch64-darwin
            suffix: ''
          - runner: macos-15-intel
            system: x86_64-darwin
            suffix: ''
          - runner: windows-2025
            system: x86_64-windows
            suffix: .exe
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-10-09-258ab27
      - name: Build the native release artifact
        shell: bash
        env:
          SYSTEM: ${{ matrix.system }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          mkdir -p dist
          roc build scripts/release_package.roc --opt=size --output="dist/release-package-$SYSTEM$SUFFIX"
          "dist/release-package-$SYSTEM$SUFFIX" > /dev/null 2>&1 || test $? = 1
          if [ -n "$SUFFIX" ]; then mv "dist/release-package-$SYSTEM$SUFFIX" "dist/release-package-$SYSTEM"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package-tool-${{ matrix.system }}
          if-no-files-found: error
          path: dist/release-package-${{ matrix.system }}

  build:
    name: Build the tools
    needs: [policy-build, docs-build, release-package-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/setup-blueprint
        with:
          install-nix: 'true'
      - run: blueprint run check
      - run: blueprint run build-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: policy-tool-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docs-tool-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-package-tool-*
          merge-multiple: true
          path: dist
      - name: Include documentation renderer font notices and standalone tests
        run: |
          mkdir -p docs-tests
          cp tools/roc-docs/tests/test_cli.py docs-tests/test_cli.py
          cp tools/roc-docs/tests/test_build.py docs-tests/test_build.py
          cp -R tools/roc-docs/tests/fixtures docs-tests/
          cat LICENSE \
            tools/roc-docs/fonts/Inter-OFL.txt \
            tools/roc-docs/fonts/Merriweather-OFL.txt \
            tools/roc-docs/fonts/SourceCodePro-OFL.md \
            tools/roc-docs/fonts/web/SPACE-GROTESK-OFL.txt \
            tools/roc-docs/fonts/web/PLUS-JAKARTA-SANS-OFL.txt \
            tools/roc-docs/vendor/roc-deflate-LICENSE \
            tools/roc-docs/vendor/NOTICE.adoc > dist/roc-docs-LICENSES.txt
      - name: Include the compatibility utility standalone regression harness
        run: |
          mkdir -p compatibility-tests/tests/fixtures
          cp tests/test_release_compatibility.py tests/test_compatibility_archive.py tests/test_release_package_examples.py compatibility-tests/tests/
          cp tests/fixtures/compatibility_example.py tests/fixtures/compatibility_launcher.c compatibility-tests/tests/fixtures/
          cp -R tests/fixtures/platform compatibility-tests/tests/fixtures/
          test -s dist/release-compatibility-archive.py
      - name: Include the policy dictionary permission notice
        run: cp tools/roc-policy/vendor/typos/LICENSE-MIT dist/roc-policy-dictionary-LICENSE-MIT.txt
      - name: Include the source-free policy test harness
        run: |
          mkdir -p policy-tests
          cp tools/roc-policy/tests/test_cli.py policy-tests/test_cli.py
      # A dispatch must have authored notes for its version. A dry run renders
      # the notes for the highest version, which are those of the next release.
      - id: version
        name: Choose the version and its notes
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="$REQUESTED"
            notes="docs/releases/tools-$version.md"
          else
            version=0.0.1-dry-run
            notes="$(printf '%s\n' docs/releases/tools-*.md | sort -V | tail -n 1)"
          fi
          test -s "$notes"
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          {
            cat "$notes"
            printf '\n## Compilers\n\n```\n'
            blueprint run compiler-version
            printf '```\n'
            printf '\nPolicy utility compiler: nightly-2026-10-15-38e6c42\nDocumentation utility compiler: nightly-2026-10-28-bad769b\n'
          } > release-notes.md
      - name: List the digests
        working-directory: dist
        run: |
          sha256sum -- * > sha256sums.txt
          cat sha256sums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools
          if-no-files-found: error
          path: |
            dist/
            release-notes.md
            policy-tests/test_cli.py
            docs-tests/
            compatibility-tests/

  # The exact files that would be published, on a runner with no checkout, no
  # Nix and no compiler: what a calling job has when an action runs one.
  test:
    name: Test the built tools (${{ matrix.system }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    permissions:
      issues: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tools
          path: tools
      - name: Check the digests
        working-directory: tools/dist
        run: |
          sha256sum --check --strict sha256sums.txt
          chmod +x -- *-"$SYSTEM"
        env:
          SYSTEM: ${{ matrix.system }}
      - name: A setup failure touches nothing
        env:
          SYSTEM: ${{ matrix.system }}
          INPUT_OUTCOME: skipped
        run: |
          if tools/dist/nightly-report-"$SYSTEM" 2> error.txt; then exit 1; fi
          grep -q 'setup failure' error.txt
      # A pass with no tracking issue only lists issues, so it needs no write access.
      - name: A pass with no tracking issue does nothing
        env:
          SYSTEM: ${{ matrix.system }}
          GH_TOKEN: ${{ github.token }}
          INPUT_OUTCOME: success
          INPUT_NIGHTLY_TAG: nightly-tools-probe
          INPUT_RELEASE_TAG: 0.0.0
          INPUT_TITLE: nightly-report tools probe, never opened
        run: |
          tools/dist/nightly-report-"$SYSTEM"
          grep -qx 'action=none' "$GITHUB_OUTPUT"
      # The version and the prerelease flag disagree, which is refused before
      # any request is made. No token is supplied.
      - name: A malformed release is refused before any request
        env:
          SYSTEM: ${{ matrix.system }}
          INPUT_VERSION: 0.1.0
          INPUT_PRERELEASE: 'true'
          INPUT_NOTES_FILE: tools/release-notes.md
          INPUT_ASSETS: tools/dist/*
          INPUT_TAG: tools-0.1.0
          INPUT_TARGET: ${{ github.sha }}
        run: |
          if tools/dist/publish-release-"$SYSTEM" 2> error.txt; then exit 1; fi
          cat error.txt
          grep -q 'prerelease' error.txt
      - name: Test the exact published compatibility and release utilities
        env:
          ROC_COMPATIBILITY_BINARY: ${{ github.workspace }}/tools/dist/release-compatibility-${{ matrix.system }}
          ROC_COMPATIBILITY_ARCHIVE_HELPER: ${{ github.workspace }}/tools/dist/release-compatibility-archive.py
          ROC_RELEASE_PACKAGE_BINARY: ${{ github.workspace }}/tools/dist/release-package-${{ matrix.system }}
        run: python3 -m unittest discover -s tools/compatibility-tests/tests -v
      # The release utility refuses to run without a command and says what it takes.
      - name: The release utility runs without a compiler and states its usage
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          if tools/dist/release-package-"$SYSTEM" 2> error.txt; then exit 1; fi
          grep -q 'usage: release-package build VERSION' error.txt

  # A platform repository tests its examples and archive on Intel macOS and
  # Windows with these exact files; Blueprint exposes the Windows one as
  # release-package.exe.
  release-package-native-test:
    name: Test the release utility (${{ matrix.system }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, system: x86_64-darwin, executable: release-package, python: python3 }
          - { runner: windows-2025, system: x86_64-windows, executable: release-package.exe, python: python }
    runs-on: ${{ matrix.runner }}
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tools
          path: tools
      - name: Check the digests
        working-directory: tools/dist
        run: |
          if command -v sha256sum > /dev/null; then
            sha256sum --check --strict sha256sums.txt
          else
            shasum -a 256 --check sha256sums.txt
          fi
      - name: Test working-tree examples, a platform build and its archive
        env:
          SYSTEM: ${{ matrix.system }}
          EXECUTABLE: ${{ matrix.executable }}
          PYTHON: ${{ matrix.python }}
        run: |
          set -euo pipefail
          cp "tools/dist/release-package-$SYSTEM" "$RUNNER_TEMP/$EXECUTABLE"
          chmod +x "$RUNNER_TEMP/$EXECUTABLE"
          ROC_RELEASE_PACKAGE_BINARY="$RUNNER_TEMP/$EXECUTABLE" "$PYTHON" -m unittest discover -s tools/compatibility-tests/tests -p test_release_package_examples.py -v

  policy-test:
    name: Test exact policy artifact (${{ matrix.system }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    permissions: {}
    steps:
      # No checkout, compiler installation, or Nix.
      # The downloaded harness creates inert fixtures and exercises the binary.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tools
          path: tools
      - name: Verify every release artifact and test the native policy binary
        shell: bash
        env:
          SYSTEM: ${{ matrix.system }}
          ROC_POLICY_BINARY: ${{ github.workspace }}/tools/dist/roc-policy-${{ matrix.system }}
        run: |
          set -euo pipefail
          cd tools/dist
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 --check sha256sums.txt
          else
            sha256sum --check --strict sha256sums.txt
          fi
          chmod +x "roc-policy-$SYSTEM"
          cd ../..
          python3 tools/policy-tests/test_cli.py -v

  docs-test:
    name: Test exact documentation artifact (${{ matrix.system }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tools
          path: tools
      - name: Verify and test the exact native documentation binary
        shell: bash
        env:
          SYSTEM: ${{ matrix.system }}
          ROC_DOCS_BINARY: ${{ github.workspace }}/tools/dist/roc-docs-${{ matrix.system }}
        run: |
          set -euo pipefail
          cd tools/dist
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 --check sha256sums.txt
          else
            sha256sum --check --strict sha256sums.txt
          fi
          chmod +x "roc-docs-$SYSTEM"
          cd ../..
          python3 tools/docs-tests/test_cli.py -v
          python3 tools/docs-tests/test_build.py -v

  publish:
    name: Publish the tools
    needs: [build, test, release-package-native-test, policy-test, docs-test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tools
          path: tools
      # The action at an earlier commit of this repository, which runs its
      # script from source. It publishes the executables that later revisions
      # of the action download.
      - uses: lukewilliamboswell/roc-automation/actions/publish-release@f21044c2035a71b6fcd2a02cdb333fb11dc797e8
        with:
          version: ${{ needs.build.outputs.version }}
          prerelease: ${{ needs.build.outputs.prerelease }}
          tag: tools-${{ needs.build.outputs.version }}
          notes-file: tools/release-notes.md
          assets: tools/dist/*
