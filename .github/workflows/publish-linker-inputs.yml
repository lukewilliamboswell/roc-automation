name: Publish signed linker inputs

on:
  workflow_call:
    inputs:
      release-tag:
        description: Immutable linker-inputs-vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      artifact-name:
        description: Name of the Actions artifact containing only release files
        required: true
        type: string
      manifest-path:
        description: Top-level release manifest file name
        default: dependency.json
        type: string
      release-name:
        description: Optional human-readable release title
        default: ""
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Require a SHA-pinned reusable workflow
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "${WORKFLOW_REF##*@}" = "$WORKFLOW_SHA"
          printf '%s\n' "$WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - name: Check out the trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lukewilliamboswell/roc-automation
          ref: ${{ github.workflow_sha }}
          path: trusted-controller
          persist-credentials: false
      - name: Download inert candidate assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: candidate
      - name: Validate candidate identities
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 trusted-controller/actions/publish-linker-inputs/publish.py validate \
            --root candidate --manifest "$MANIFEST_PATH" --tag "$RELEASE_TAG" \
            --repository "$SOURCE_REPOSITORY" --commit "$SOURCE_COMMIT"
      - name: Attest manifest and release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v3.0.0
        with:
          subject-path: candidate/*
      - name: Draft, verify, and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_NAME: ${{ inputs.release-name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 trusted-controller/actions/publish-linker-inputs/publish.py publish \
            --root candidate --manifest "$MANIFEST_PATH" --tag "$RELEASE_TAG" \
            --repository "$SOURCE_REPOSITORY" --commit "$SOURCE_COMMIT" \
            --release-name "$RELEASE_NAME"
