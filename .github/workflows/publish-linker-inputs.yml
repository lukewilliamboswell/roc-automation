name: Publish signed linker inputs

on:
  workflow_call:
    inputs:
      release-tag:
        description: Immutable linker-inputs-vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      artifact-name:
        description: Name of the Actions artifact containing only release files
        required: true
        type: string
      manifest-path:
        description: Top-level release manifest file name
        default: dependency.json
        type: string
      release-name:
        description: Optional human-readable release title
        default: ""
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download inert candidate assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: candidate
      - name: Validate candidate identities
        uses: lukewilliamboswell/roc-automation/actions/publish-linker-inputs@e21bc1b63f8d5ae4f293f596e5102e5c8f21f637
        with:
          command: validate
          root: candidate
          manifest: ${{ inputs.manifest-path }}
          tag: ${{ inputs.release-tag }}
          repository: ${{ github.repository }}
          commit: ${{ github.sha }}
          release-name: ${{ inputs.release-name }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Attest manifest and release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v3.0.0
        with:
          subject-path: candidate/*
      - name: Draft, verify, and publish immutable release
        uses: lukewilliamboswell/roc-automation/actions/publish-linker-inputs@e21bc1b63f8d5ae4f293f596e5102e5c8f21f637
        with:
          command: publish
          root: candidate
          manifest: ${{ inputs.manifest-path }}
          tag: ${{ inputs.release-tag }}
          repository: ${{ github.repository }}
          commit: ${{ github.sha }}
          release-name: ${{ inputs.release-name }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
