name: Update Roc nightly

on:
  workflow_call:

permissions: {}
env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  prepare:
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      auto_merge: ${{ steps.prepare.outputs.auto_merge }}
      changed: ${{ steps.prepare.outputs.changed }}
      sha: ${{ steps.prepare.outputs.sha }}
      nightly: ${{ steps.prepare.outputs.nightly }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - id: prepare
      name: Prepare signed pin commit and PR
      env:
        GH_TOKEN: ${{ github.token }}
        FORCE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false'
          }}
      uses: 
        lukewilliamboswell/roc-automation/actions/nightly@31f05e90fddeda335e7d9c9c0a34a8830c9d7170
      with:
        phase: prepare
  validate:
    needs: prepare
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
      statuses: write
    outputs:
      runs: ${{ steps.validate.outputs.runs }}
      passed: ${{ steps.validate.outputs.passed }}
    steps:
      # This is the trusted controller, not a checkout of the candidate.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - id: validate
      name: Dispatch candidate validation and await its results
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
      uses: 
        lukewilliamboswell/roc-automation/actions/nightly@31f05e90fddeda335e7d9c9c0a34a8830c9d7170
      with:
        phase: validate
  report:
    needs: [prepare, validate]
    if: always() && github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - name: Report results for this candidate
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
        NIGHTLY_TAG: ${{ needs.prepare.outputs.nightly }}
        TEST_RESULT: ${{ needs.validate.result }}
        TEST_PASSED: ${{ needs.validate.outputs.passed }}
        VALIDATION_RUNS: ${{ needs.validate.outputs.runs }}
      uses: 
        lukewilliamboswell/roc-automation/actions/nightly@31f05e90fddeda335e7d9c9c0a34a8830c9d7170
      with:
        phase: report

  merge:
    needs: [prepare, validate, report]
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.validate.outputs.passed == 'true' && needs.report.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      # No consumer checkout. Policy is read through the API at github.sha.
      - name: Merge the validated pin update after rechecking live evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          NIGHTLY_TAG: ${{ needs.prepare.outputs.nightly }}
          VALIDATION_RUNS: ${{ needs.validate.outputs.runs }}
        uses: lukewilliamboswell/roc-automation/actions/nightly@31f05e90fddeda335e7d9c9c0a34a8830c9d7170
        with:
          phase: merge
