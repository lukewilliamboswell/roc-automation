name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 20 * * *'

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: renderer
        name: Get the tested upstream renderer
        uses: ./actions/build-roc-docs-tool

      - id: docs
        name: Build the HTML site and PDF manual
        uses: ./actions/build-docs
        with:
          renderer-binary: ${{ steps.renderer.outputs.renderer-binary }}
          pdf-filename: roc-automation.pdf
          docs-version: ${{ github.event_name == 'pull_request' && format('3 (pull request {0})', github.event.number) || '3' }}

      - name: Install the independent PDF reader for upstream verification
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null || ! command -v pdftocairo >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi

      - name: Check PDF contents hierarchy, source colours and layout with the independent reader
        env:
          ROC_DOCS_BINARY: ${{ steps.renderer.outputs.renderer-binary }}
        run: python3 tools/roc-docs/tests/test_cli.py RendererTests.test_pdf_contents_preserves_heading_hierarchy_and_wrapping RendererTests.test_rc6_page_references_chapter_headers_callouts_and_rich_lists RendererTests.test_unicode_pdf_destinations_are_encoded_consistently RendererTests.test_pdf_highlighting_accepts_each_supported_language RendererTests.test_independent_reader_pagination_tags_colours_and_source -v

      # Python here is an independent test oracle, never part of rendering.
      - name: Verify the rendered manual preserves source inventories and links
        env:
          SITE: ${{ steps.docs.outputs.site-directory }}
          PDF: ${{ steps.docs.outputs.pdf-path }}
          DOCS_VERSION: ${{ github.event_name == 'pull_request' && format('3 (pull request {0})', github.event.number) || '3' }}
        run: |
          python3 tools/roc-docs/tests/reference_prepare_docs.py --workspace . --output-directory .docs-verification-prepared --pdf-filename roc-automation.pdf --docs-version "$DOCS_VERSION"
          python3 tools/roc-docs/tests/verify_prepared.py --prepared .docs-verification-prepared --site "$SITE" --pdf "$PDF" --independent-reader

      - name: Check desktop and mobile HTML in a real browser
        env:
          SITE: ${{ steps.docs.outputs.site-directory }}
          CHROME: google-chrome
        run: node tools/roc-docs/tests/check_html_browser.mjs "$SITE" docs-browser-review

      - name: Upload HTML review screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-browser-review
          path: docs-browser-review
          if-no-files-found: ignore

      - name: Set up the pinned environment for the downstream inventory
        uses: ./actions/setup-blueprint
        with:
          install-nix: 'true'

      - name: Refresh downstream automation version badges
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ steps.docs.outputs.site-directory }}
        run: blueprint run downstream-status -- "$SITE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ steps.docs.outputs.site-directory }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
