name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: renderer
        name: Get the tested upstream renderer
        uses: ./actions/build-roc-docs-tool

      - id: docs
        name: Build the HTML site and PDF manual
        uses: ./actions/build-docs
        with:
          renderer-binary: ${{ steps.renderer.outputs.renderer-binary }}
          pdf-filename: roc-automation.pdf
          docs-version: ${{ github.event_name == 'pull_request' && format('3 (pull request {0})', github.event.number) || '3' }}

      - name: Install the independent PDF reader for upstream verification
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi

      # Python here is an independent test oracle, never part of rendering.
      - name: Verify the rendered manual preserves source inventories and links
        env:
          SITE: ${{ steps.docs.outputs.site-directory }}
          PDF: ${{ steps.docs.outputs.pdf-path }}
          DOCS_VERSION: ${{ github.event_name == 'pull_request' && format('3 (pull request {0})', github.event.number) || '3' }}
        run: |
          python3 tools/roc-docs/tests/reference_prepare_docs.py --workspace . --output-directory .docs-verification-prepared --pdf-filename roc-automation.pdf --docs-version "$DOCS_VERSION"
          python3 tools/roc-docs/tests/verify_prepared.py --prepared .docs-verification-prepared --site "$SITE" --pdf "$PDF" --independent-reader

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ steps.docs.outputs.site-directory }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
