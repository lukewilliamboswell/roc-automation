name: Automation tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-compatibility:
    name: Published release compatibility regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-10-09-258ab27
      - name: Build the shared runner
        run: roc build scripts/release_compatibility.roc --output="$RUNNER_TEMP/release-compatibility"
      - name: Exercise diagnostics, immutable archives and unhappy paths
        env:
          ROC_COMPATIBILITY_BINARY: ${{ runner.temp }}/release-compatibility
        run: python3 -m unittest discover -s tests -p test_release_compatibility.py -v
  controller-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Test documentation preparation and acceptance verifier
        run: |
          python3 -m unittest discover -s tools/roc-docs/tests -p test_prepare_docs.py -v
          python3 -m unittest discover -s tools/roc-docs/tests -p test_verify_prepared.py -v
  documentation-action:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: renderer
        uses: ./actions/build-roc-docs-tool
      - id: docs
        uses: ./actions/build-docs
        with:
          renderer-binary: ${{ steps.renderer.outputs.renderer-binary }}
          docs-directory: tests/fixtures/docs-manual/docs
          output-directory: .docs-test
          pdf-filename: fixture.pdf
          docs-version: test
      - name: Check generated publication
        env:
          SITE: ${{ steps.docs.outputs.site-directory }}
          PDF: ${{ steps.docs.outputs.pdf-path }}
        run: |
          test -s "$SITE/index.html"
          test -s "$SITE/usage.html"
          test -s "$SITE/example.json"
          test -s "$SITE/fixture.pdf"
          test -s "$PDF"
          grep -q 'data-lang="roc"' "$SITE/usage.html"
          grep -q 'images/diagram-' "$SITE/index.html"
  setup-blueprint-action:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: blueprint
        uses: ./actions/setup-blueprint
        with:
          install-nix: 'true'
      - name: Check the installed command
        env:
          BLUEPRINT: ${{ steps.blueprint.outputs.blueprint-path }}
          VERSION: ${{ steps.blueprint.outputs.version }}
        run: |
          # The action took the release from Blueprint.roc; the binary must agree.
          test -n "$VERSION"
          test "$(blueprint --version)" = "$VERSION"
          test "$(command -v blueprint)" = "$BLUEPRINT"
          nix --version
          blueprint --help
  nightly-report-action:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action runs its Roc script from source: it installs Nix and the
      # verified blueprint, then runs the nightly-report task of this checkout.
      # A pass with no tracking issue only lists issues, so it needs no write access.
      - id: report
        uses: ./actions/nightly-report
        with:
          outcome: success
          nightly-tag: nightly-ci-probe
          release-tag: 0.0.0
          title: nightly-report CI probe, never opened
      - name: Check that nothing was done
        env:
          ACTION: ${{ steps.report.outputs.action }}
          ISSUE: ${{ steps.report.outputs.issue-number }}
        run: |
          test "$ACTION" = none
          test -z "$ISSUE"
  # The repository's own Roc scripts, on the pinned tooling compiler. This does
  # not ask GitHub about any repository's settings: that needs administration
  # access, which no workflow token has, so a maintainer runs check-settings.
  roc-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/setup-blueprint
        with:
          install-nix: 'true'
      - run: blueprint run check
  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Lint workflow contracts
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
