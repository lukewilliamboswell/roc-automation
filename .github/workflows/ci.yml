name: Automation tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-compatibility:
    name: Published release compatibility (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PYTHON_COMMAND: ${{ startsWith(matrix.runner, 'windows-') && 'python' || 'python3' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-10-09-258ab27
      - id: build
        name: Build the shared runner using its native action bootstrap
        run: '"$PYTHON_COMMAND" actions/release-compatibility/bootstrap.py'
      - name: Exercise diagnostics, immutable archives, timeouts and process-tree cleanup
        env:
          ROC_COMPATIBILITY_BINARY: ${{ steps.build.outputs.directory }}/runner${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          "$PYTHON_COMMAND" -m unittest discover -s tests -p test_compatibility_archive.py -v
          "$PYTHON_COMMAND" -m unittest discover -s tests -p test_release_compatibility.py -v
          "$PYTHON_COMMAND" -m unittest discover -s tests -p test_compatibility_workflow.py -v
          "$PYTHON_COMMAND" -m unittest discover -s tests -p test_compatibility_packaging.py -v
      - name: Verify dashboard verdict origin using the native utility
        if: runner.os != 'Windows'
        env:
          TOOLING_COMPILER: ${{ steps.build.outputs.directory }}/tooling/roc
          ROC_DOWNSTREAM_STATUS_BINARY: ${{ runner.temp }}/downstream-status
        run: |
          "$TOOLING_COMPILER" build scripts/downstream_status.roc --output="$ROC_DOWNSTREAM_STATUS_BINARY"
          "$PYTHON_COMMAND" -m unittest discover -s tests -p test_downstream_status.py -v
      - name: Build and execute a real Windows example with the fixed baseline compiler
        if: runner.os == 'Windows'
        env:
          ROC_COMPATIBILITY_BINARY: ${{ steps.build.outputs.directory }}/runner.exe
          ROC_COMPATIBILITY_SMOKE_COMPILER: ${{ steps.build.outputs.directory }}/tooling/roc.exe
        run: '"$PYTHON_COMMAND" tests/run_compatibility_smoke.py'
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-10-20-7a8a800
      - name: Check, build and execute a real published-platform example
        if: runner.os != 'Windows'
        env:
          ROC_COMPATIBILITY_BINARY: ${{ steps.build.outputs.directory }}/runner${{ runner.os == 'Windows' && '.exe' || '' }}
        run: '"$PYTHON_COMMAND" tests/run_compatibility_smoke.py'
      - name: Verify the broken Windows nightly remains incompatible with diagnostics
        if: runner.os == 'Windows'
        env:
          ROC_COMPATIBILITY_BINARY: ${{ steps.build.outputs.directory }}/runner.exe
          ROC_COMPATIBILITY_SMOKE_EXPECTED: incompatible
        run: '"$PYTHON_COMMAND" tests/run_compatibility_smoke.py'
  controller-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Test documentation preparation and acceptance verifier
        run: |
          python3 -m unittest discover -s tools/roc-docs/tests -p test_prepare_docs.py -v
          python3 -m unittest discover -s tools/roc-docs/tests -p test_verify_prepared.py -v
  documentation-action:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: renderer
        uses: ./actions/build-roc-docs-tool
      - id: docs
        uses: ./actions/build-docs
        with:
          renderer-binary: ${{ steps.renderer.outputs.renderer-binary }}
          docs-directory: tests/fixtures/docs-manual/docs
          output-directory: .docs-test
          pdf-filename: fixture.pdf
          docs-version: test
      - name: Check generated publication
        env:
          SITE: ${{ steps.docs.outputs.site-directory }}
          PDF: ${{ steps.docs.outputs.pdf-path }}
        run: |
          test -s "$SITE/index.html"
          test -s "$SITE/usage.html"
          test -s "$SITE/example.json"
          test -s "$SITE/fixture.pdf"
          test -s "$PDF"
          grep -q 'data-lang="roc"' "$SITE/usage.html"
          grep -q 'images/diagram-' "$SITE/index.html"
  setup-blueprint-action:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: blueprint
        uses: ./actions/setup-blueprint
        with:
          install-nix: 'true'
      - name: Check the installed command
        env:
          BLUEPRINT: ${{ steps.blueprint.outputs.blueprint-path }}
          VERSION: ${{ steps.blueprint.outputs.version }}
        run: |
          # The action took the release from Blueprint.roc; the binary must agree.
          test -n "$VERSION"
          test "$(blueprint --version)" = "$VERSION"
          test "$(command -v blueprint)" = "$BLUEPRINT"
          nix --version
          blueprint --help
  nightly-report-action:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action runs its Roc script from source: it installs Nix and the
      # verified blueprint, then runs the nightly-report task of this checkout.
      # A pass with no tracking issue only lists issues, so it needs no write access.
      - id: report
        uses: ./actions/nightly-report
        with:
          outcome: success
          nightly-tag: nightly-ci-probe
          release-tag: 0.0.0
          title: nightly-report CI probe, never opened
      - name: Check that nothing was done
        env:
          ACTION: ${{ steps.report.outputs.action }}
          ISSUE: ${{ steps.report.outputs.issue-number }}
        run: |
          test "$ACTION" = none
          test -z "$ISSUE"
  build-runner:
    name: Check the native Roc build runner (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ROC_BUILD_RUNNER_BINARY: ${{ github.workspace }}/roc-build-runner-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-10-18-1df370f
      - name: Check the versioned source contract
        run: roc fmt --check tools/roc-build-runner
      - name: Run portable contract tests
        run: roc test tools/roc-build-runner/main.roc
      - name: Compile the standalone native executable
        run: roc build tools/roc-build-runner/main.roc --output="$ROC_BUILD_RUNNER_BINARY"
      - name: Check native refusals without a sandbox
        run: python3 tools/roc-build-runner/tests/test_cli.py -v

  sbom-actions:
    name: SBOM sidecars and supplier chain (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, system: x86_64-linux }
          - { runner: ubuntu-24.04-arm, system: aarch64-linux }
          - { runner: macos-15, system: aarch64-darwin }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A consumer that pins a supplier's release file by its published SHA-256;
      # the supplier, roc-blueprint 0.7.0, publishes sidecars beside that file.
      - name: Use the consumer fixture
        run: |
          cp examples/sbom-chain/Blueprint.roc examples/sbom-chain/Blueprint.lock .
          cp -R examples/sbom-chain/package examples/sbom-chain/app examples/sbom-chain/sbom .
      - uses: ./actions/setup-blueprint
      # The SBOM tool bundle runs on the exact Roc release its Blueprint release records.
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-10-21-5349569
      - id: bundle
        name: Build the release file
        run: |
          mkdir dist
          roc bundle package/main.roc --output-dir dist
          echo "file=$(ls dist/*.tar.zst)" >> "$GITHUB_OUTPUT"
      - id: fetch
        uses: ./actions/fetch-dependency-sboms
        with:
          target: source
      - id: sidecars
        uses: ./actions/sbom-sidecars
        with:
          files: ${{ steps.bundle.outputs.file }}
          version: 0.1.0
          target: source
          author: 'Organization: roc-automation contributors'
          imports: sbom/imports.json
          spdx-2-3: 'true'
      - name: Check the supplier graph is bound into the attested asset set
        env:
          FETCHED: ${{ steps.fetch.outputs.fetched }}
          MISSING: ${{ steps.fetch.outputs.missing }}
          ASSETS: ${{ steps.sidecars.outputs.assets }}
          DIGESTS: ${{ steps.sidecars.outputs.digests }}
          FILE: ${{ steps.bundle.outputs.file }}
        run: |
          test "$FETCHED" = 1
          test "$MISSING" = 0
          test "$(printf '%s\n' "$ASSETS" | wc -l | tr -d ' ')" = 5
          shasum -a 256 --check "$DIGESTS"
          test -s "$FILE.sbom-manifest.json"
          grep -q '#blueprint-core-sbom-Subject' "$FILE.spdx.json"
          grep -q '"copiedTo"' "$FILE.spdx.json"
      # A native executable is a second subject, bound per target with its own
      # composition: it imports the supplier's bundle SBOM bound, and the
      # fetched fixed compiler is a locked dependency whose publisher ships no
      # SBOM, so a reviewed opt-out becomes a visible gap.
      - name: Build the native executable
        run: |
          mkdir dist-native
          roc build app/main.roc --output=dist-native/hello
          dist-native/hello
      - id: fetch-native
        uses: ./actions/fetch-dependency-sboms
        with:
          target: ${{ matrix.system }}
          composition: sbom/composition-${{ matrix.system }}.json
          output: sbom/imports-${{ matrix.system }}.json
      - id: sidecars-native
        uses: ./actions/sbom-sidecars
        with:
          files: dist-native/hello
          version: 0.1.0
          target: ${{ matrix.system }}
          author: 'Organization: roc-automation contributors'
          composition: sbom/composition-${{ matrix.system }}.json
          imports: sbom/imports-${{ matrix.system }}.json
      - name: Check the native sidecars name their target and the compiler gap
        env:
          FETCHED: ${{ steps.fetch-native.outputs.fetched }}
          MISSING: ${{ steps.fetch-native.outputs.missing }}
          ASSETS: ${{ steps.sidecars-native.outputs.assets }}
          DIGESTS: ${{ steps.sidecars-native.outputs.digests }}
          EVIDENCE: ${{ steps.sidecars-native.outputs.evidence }}
          SYSTEM: ${{ matrix.system }}
        run: |
          test "$FETCHED" = 1
          test "$MISSING" = 0
          test "$(printf '%s\n' "$ASSETS" | wc -l | tr -d ' ')" = 4
          shasum -a 256 --check "$DIGESTS"
          test -s dist-native/hello.sbom-manifest.json
          grep -q "\"blueprint:target\",\"value\":\"$SYSTEM\"" dist-native/hello.cdx.json
          grep -q 'sbom:roc-stable' dist-native/hello.spdx.json
          grep -q '#blueprint-core-sbom-Subject' dist-native/hello.spdx.json
          test "$(shasum -a 256 dist-native/hello | cut -d' ' -f1)" = "$(python3 -c 'import json;print(json.load(open("dist-native/hello.cdx.json"))["metadata"]["component"]["hashes"][0]["content"])')"
          # The evidence envelope binds the same bytes to this commit and run.
          python3 - "$EVIDENCE" "$SYSTEM" <<'PY'
          import hashlib, json, os, sys
          envelope = json.load(open(sys.argv[1]))
          assert envelope["format"] == "roc-automation-sbom-evidence-v1"
          assert envelope["source"]["commit"] == os.environ["GITHUB_SHA"] and envelope["producer"]["run_id"] == os.environ["GITHUB_RUN_ID"]
          [subject] = envelope["subjects"]
          assert subject["target"] == sys.argv[2] and subject["sha256"] == hashlib.sha256(open(subject["path"], "rb").read()).hexdigest()
          for sidecar in subject["sidecars"]:
              assert sidecar["sha256"] == hashlib.sha256(open(sidecar["path"], "rb").read()).hexdigest() and sidecar["size"] == os.path.getsize(sidecar["path"])
          assert sorted(gap["scope"] for gap in envelope["coverage"]) == ["import:blueprint-core-sbom", "native-closure", "sbom:roc-stable"], envelope["coverage"]
          PY
      - name: Provoke the refusals a maintainer must see
        run: python3 tests/check_sbom_chain.py

  # The shared release utility against the pure-package starter: the working
  # tree's examples, then the bundle, archives and notes it would publish, then
  # the archived examples against that exact bundle over a loopback address.
  # The package compiler is fixed here because this tests the utility, not the
  # starter's compatibility with the moving nightly.
  release-package:
    name: Build and test a package release with the shared utility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The utility is built here from source with the tooling compiler, as a
      # tools release builds it; consumers fetch that release through Blueprint.
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-10-09-258ab27
      - id: tool
        name: Build the release utility with the tooling compiler
        run: |
          set -euo pipefail
          roc build scripts/release_package.roc --output="$RUNNER_TEMP/release-package"
          echo "binary=$RUNNER_TEMP/release-package" >> "$GITHUB_OUTPUT"
          # setup-roc finds the first compiler extracted into the workspace, so
          # the tooling installation goes before the package nightly arrives.
          rm -rf "$GITHUB_WORKSPACE"/roc_nightly-*
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-10-23-18478ff
      - name: Build and test the starter's release
        working-directory: examples/pure-package
        env:
          TOOL: ${{ steps.tool.outputs.binary }}
          RP_REPOSITORY: lukewilliamboswell/pure-package-example
          RP_DIRECTORY: ${{ runner.temp }}/release-package
        run: |
          "$TOOL" test-examples
          "$TOOL" build 0.0.1-dryrun
          "$TOOL" test-archive
          test -s dist/release-notes.md
          # Two bundles: the package and the data package the directory example depends on.
          bundles=(dist/pure-package-example-*.tar.zst)
          test "${#bundles[@]}" = 2
          compgen -G 'dist/pure-package-example-data-*.tar.zst' > /dev/null
          grep -c 'releases/download/0.0.1-dryrun/pure-package-example-' dist/release-notes.md | grep -qx 2
          unzip -Z1 dist/pure-package-example-examples-0.0.1-dryrun.zip | grep -qx 'pure-package-example-examples-0.0.1-dryrun/examples/hello.roc'
          unzip -Z1 dist/pure-package-example-examples-0.0.1-dryrun.zip | grep -qx 'pure-package-example-examples-0.0.1-dryrun/examples/greet/Format.roc'
          unzip -Z1 dist/pure-package-example-docs-0.0.1-dryrun.zip | grep -qx '0.0.1-dryrun/index.html'
      - name: Refuse an archive whose examples were edited after testing
        working-directory: examples/pure-package
        env:
          TOOL: ${{ steps.tool.outputs.binary }}
          RP_REPOSITORY: lukewilliamboswell/pure-package-example
          RP_DIRECTORY: ${{ runner.temp }}/release-package-tampered
        run: |
          mkdir -p "$RUNNER_TEMP/tampered/pure-package-example-examples-0.0.1-dryrun/examples"
          cd "$RUNNER_TEMP/tampered"
          unzip -q "$GITHUB_WORKSPACE/examples/pure-package/dist/pure-package-example-examples-0.0.1-dryrun.zip"
          sed -i 's/Hello from a pure Roc package/edited/' pure-package-example-examples-0.0.1-dryrun/spec.json
          rm "$GITHUB_WORKSPACE/examples/pure-package/dist/pure-package-example-examples-0.0.1-dryrun.zip"
          zip -q -X -D -r "$GITHUB_WORKSPACE/examples/pure-package/dist/pure-package-example-examples-0.0.1-dryrun.zip" pure-package-example-examples-0.0.1-dryrun
          cd "$GITHUB_WORKSPACE/examples/pure-package"
          if "$TOOL" test-archive; then
            echo '::error::an archive with changed expectations passed'
            exit 1
          fi
          compgen -G "$RP_DIRECTORY/*-expected.json" > /dev/null

  # The repository's own Roc scripts, on the pinned tooling compiler. This does
  # not ask GitHub about any repository's settings: that needs administration
  # access, which no workflow token has, so a maintainer runs check-settings.
  roc-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/setup-blueprint
        with:
          install-nix: 'true'
      - run: blueprint run check
  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Lint workflow contracts
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # actionlint 1.7 predates job.workflow_repository and job.workflow_sha,
          # which the shared release workflow uses to check out its own commit.
          ignore='property "workflow_(repository|sha)" is not defined in object type'
          actionlint -ignore "$ignore"
          actionlint examples/pure-package/.github/workflows/ci.yml
          actionlint examples/pure-package/.github/workflows/release.yml
          actionlint examples/sbom-chain/.github/workflows/release.yml
