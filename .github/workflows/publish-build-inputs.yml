name: Publish content-addressed build inputs

on:
  workflow_call:
    inputs:
      pull-request:
        description: Same-repository pull request containing the exact producer source
        required: true
        type: string
      producer-workflow:
        description: Workflow filename to dispatch on the pull request branch
        required: true
        type: string
      candidate-artifact:
        description: Exact artifact name produced by the candidate workflow
        required: true
        type: string
      lock-path:
        description: Only repository path the trusted controller may commit
        required: true
        type: string
      release-prefix:
        description: Prefix for the manifest-hash-derived immutable release tag
        required: true
        type: string
    outputs:
      release:
        description: Published content-addressed release tag
        value: ${{ jobs.publish.outputs.release }}
      lock-commit:
        description: GitHub-signed lock adoption commit
        value: ${{ jobs.publish.outputs.lock-commit }}

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: write
      attestations: read
      contents: write
      pull-requests: read
    outputs:
      release: ${{ steps.publish.outputs.release }}
      lock-commit: ${{ steps.publish.outputs.lock_commit }}
    steps:
      - name: Check out the exact reusable workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .roc-automation-controller
          persist-credentials: false
      - id: publish
        name: Validate, publish, and commit the selected lock
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
          INPUT_PRODUCER_WORKFLOW: ${{ inputs.producer-workflow }}
          INPUT_CANDIDATE_ARTIFACT: ${{ inputs.candidate-artifact }}
          INPUT_LOCK_PATH: ${{ inputs.lock-path }}
          INPUT_RELEASE_PREFIX: ${{ inputs.release-prefix }}
        run: python3 .roc-automation-controller/actions/publish-build-inputs/publish_build_inputs.py
