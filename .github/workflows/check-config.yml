name: Check Roc nightly configuration
on:
  workflow_call:
permissions:
  contents: read
jobs:
  controller-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check compiler pin and validation workflow configuration
        uses: lukewilliamboswell/roc-automation/actions/nightly@31f05e90fddeda335e7d9c9c0a34a8830c9d7170
        with:
          phase: check
